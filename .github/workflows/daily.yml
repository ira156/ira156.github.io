name: 赵梓池工作台·每日数据更新
# 云端定时：无需本机软件，GitHub Actions 每天按北京时 07:30 / 12:30 / 19:30 自动跑
# 免 key 抓取：气象/船队/微博/B站/小红书热榜/国际要闻/金句 必定刷新；
# LLM 精编分区(政策/AI Agent/小红书精选/国内精编)需配置 LLM_API_KEY 后由 LLM 生成。
on:
  schedule:
    - cron: '30 23 * * *'   # 北京 07:30（UTC 23:30 前一天）
    - cron: '30 4 * * *'    # 北京 12:30（UTC 04:30）
    - cron: '30 11 * * *'   # 北京 19:30（UTC 11:30）
  workflow_dispatch: {}     # 支持在 Actions 页面手动触发
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取气象（Open-Meteo 免 key）
        run: node fetch_weather.js
      - name: 抓取船队（ShipXY，密钥取自 secret）
        env:
          SHIPXY_KEY: ${{ secrets.SHIPXY_KEY }}
        run: node fetch_ships.js || echo "⚠️ 船队抓取失败，检查 SHIPXY_KEY secret"
      - name: 抓取每日热榜（微博/B站/小红书/国际/金句，免 key）
        run: node fetch_hot.js || echo "⚠️ 热榜抓取失败，保留旧值"
      - name: 生成 LLM 精编内容（可选，配置 LLM_API_KEY 后生效）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node gen_daily_api.js || echo "⚠️ 内容生成跳过（未配置 LLM_API_KEY）"
      - name: 提交并推送到 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json data/ships.json data/daily.json js/ css/ index.html
          git commit -m "每日数据更新 $(TZ=Asia/Shanghai date +%F)" || echo "无变更，跳过提交"
          git push

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B8C6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="梓池工作台">
<title>赵梓池的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 顶部 ============ -->
<header class="topbar" id="topbar">
  <div class="tb-left">
    <div class="avatar" aria-label="Kitty 头像">
      <svg class="kitty-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 30 L12 10 L28 24 Z" fill="#fff" stroke="#5B8C6A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M48 30 L52 10 L36 24 Z" fill="#fff" stroke="#5B8C6A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M18 27 L15 15 L25 23 Z" fill="#F4C9D6"/>
        <path d="M46 27 L49 15 L39 23 Z" fill="#F4C9D6"/>
        <ellipse cx="32" cy="37" rx="23" ry="21" fill="#fff" stroke="#5B8C6A" stroke-width="2"/>
        <ellipse cx="24" cy="37" rx="2.6" ry="3.4" fill="#3A3A3A"/>
        <ellipse cx="40" cy="37" rx="2.6" ry="3.4" fill="#3A3A3A"/>
        <ellipse cx="32" cy="43" rx="2.2" ry="1.6" fill="#F2B705"/>
        <ellipse cx="19" cy="44" rx="3.4" ry="2.3" fill="#F4A9B8" opacity=".6"/>
        <ellipse cx="45" cy="44" rx="3.4" ry="2.3" fill="#F4A9B8" opacity=".6"/>
        <path d="M12 9 L4 5 L4 15 Z" fill="#E8A0A0" stroke="#D98A8A" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M12 9 L20 5 L20 15 Z" fill="#E8A0A0" stroke="#D98A8A" stroke-width="0.6" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="3" fill="#D98A8A"/>
      </svg>
    </div>
    <div class="tb-txt">
      <h1 id="greeting">你好，赵梓池</h1>
      <p id="dateline">载入中…</p>
    </div>
  </div>
  <div class="tb-right">
    <button class="icon-btn" id="btnRefresh" title="刷新数据" aria-label="刷新">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main id="main">

<!-- ============ 页面：今日 ============ -->
<section class="page active" id="page-home">

  <!-- Kitty 欢迎横幅 -->
  <div class="kitty-banner">
    <div class="kitty-mascot">
      <svg class="kitty-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 30 L12 10 L28 24 Z" fill="#fff" stroke="#5B8C6A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M48 30 L52 10 L36 24 Z" fill="#fff" stroke="#5B8C6A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M18 27 L15 15 L25 23 Z" fill="#F4C9D6"/>
        <path d="M46 27 L49 15 L39 23 Z" fill="#F4C9D6"/>
        <ellipse cx="32" cy="37" rx="23" ry="21" fill="#fff" stroke="#5B8C6A" stroke-width="2"/>
        <ellipse cx="24" cy="37" rx="2.6" ry="3.4" fill="#3A3A3A"/>
        <ellipse cx="40" cy="37" rx="2.6" ry="3.4" fill="#3A3A3A"/>
        <ellipse cx="32" cy="43" rx="2.2" ry="1.6" fill="#F2B705"/>
        <ellipse cx="19" cy="44" rx="3.4" ry="2.3" fill="#F4A9B8" opacity=".6"/>
        <ellipse cx="45" cy="44" rx="3.4" ry="2.3" fill="#F4A9B8" opacity=".6"/>
        <path d="M12 9 L4 5 L4 15 Z" fill="#E8A0A0" stroke="#D98A8A" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M12 9 L20 5 L20 15 Z" fill="#E8A0A0" stroke="#D98A8A" stroke-width="0.6" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="3" fill="#D98A8A"/>
      </svg>
    </div>
    <div class="kb-txt">
      <div class="kb-hi" id="kittyHi">今天也要元气满满 🌿</div>
      <div class="kb-sub">你的专属小猫陪你开工啦～</div>
    </div>
  </div>

 <div class="cols">
  <div class="col">

  <!-- 打卡 -->
  <div class="card punch-card">
    <div class="punch-head">
      <div>
        <div class="punch-label">今日工时</div>
        <div class="punch-timer" id="punchTimer">00:00:00</div>
      </div>
      <div class="punch-state" id="punchState">未打卡</div>
    </div>
    <div class="punch-meta" id="punchMeta">今天还没有开始记录</div>
    <div class="punch-actions">
      <button class="btn btn-primary" id="btnPunch">上班打卡</button>
      <button class="btn btn-ghost" id="btnPunchEdit">补录 / 修改</button>
    </div>
    <div class="punch-bar"><div class="punch-bar-fill" id="punchBar"></div><span class="punch-bar-goal" id="punchGoalTxt">目标 8h</span></div>
  </div>

  <!-- 任务 -->
  <div class="card">
    <div class="card-head">
      <h2>今日任务</h2>
      <div class="head-right">
        <span class="ring" id="taskRing"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.9"/></svg><b id="ringTxt">0%</b></span>
      </div>
    </div>
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="添加一项任务，回车确认" maxlength="120">
      <select id="taskPrio" aria-label="优先级">
        <option value="2">普通</option>
        <option value="3">重要</option>
        <option value="1">低</option>
      </select>
      <button class="btn btn-primary btn-sm" id="btnAddTask">添加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
    <div class="task-foot">
      <button class="link-btn" id="btnTplMgr">每日重复任务</button>
      <button class="link-btn" id="btnClearDone">清除已完成</button>
    </div>
  </div>

  </div>
  <div class="col">

  <!-- 今日速览 -->
  <div class="card">
    <div class="card-head"><h2>今日速览</h2><span class="tag-live" id="briefLive">实时</span></div>
    <div class="brief-grid" id="briefGrid">
      <div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div>
    </div>
  </div>

  </div>
 </div>
</section>

<!-- ============ 页面：爆款 ============ -->
<section class="page" id="page-hot">
  <div class="subtabs" id="hotTabs">
    <button class="subtab active" data-p="douyin">抖音</button>
    <button class="subtab" data-p="xhs">小红书</button>
    <button class="subtab" data-p="bili">B站</button>
    <button class="subtab" data-p="weibo">微博</button>
  </div>
  <div id="hotBody"></div>
</section>

<!-- ============ 页面：资讯 ============ -->
<section class="page" id="page-news">
  <div class="subtabs" id="newsTabs">
    <button class="subtab active" data-p="cn">国内</button>
    <button class="subtab" data-p="world">国际</button>
    <button class="subtab" data-p="policy">政策法律</button>
    <button class="subtab" data-p="agent">AI Agent</button>
  </div>
  <div id="newsBody"></div>
</section>

<!-- ============ 页面：灵感 ============ -->
<section class="page" id="page-idea">
  <div id="ideaBody"></div>
</section>

<!-- ============ 页面：工时 ============ -->
<section class="page" id="page-time">
  <div id="timeBody"></div>
</section>

</main>

<!-- ============ 底部导航 ============ -->
<nav class="tabbar" id="tabbar">
  <button class="tab active" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>今日</span>
  </button>
  <button class="tab" data-page="hot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1.5.6-2.8 1.2-3.8"/><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5-2-5"/><path d="M12 22a7 7 0 0 1-7-7c0-1.5.5-2.8 1.2-3.9"/></svg><span>爆款</span>
  </button>
  <button class="tab" data-page="news">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/></svg><span>资讯</span>
  </button>
  <button class="tab" data-page="idea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg><span>灵感</span>
  </button>
  <button class="tab" data-page="time">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>工时</span>
  </button>
</nav>

<!-- ============ 弹窗 ============ -->
<div class="modal-mask" id="modalMask"></div>
<div class="modal" id="modal">
  <div class="modal-head"><h3 id="modalTitle">标题</h3><button class="icon-btn" id="modalClose">✕</button></div>
  <div class="modal-body" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
